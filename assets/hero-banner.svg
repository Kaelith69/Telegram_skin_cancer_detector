<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" role="img" aria-label="Skin Cancer Detector Bot — Hero Banner">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0a1f2e"/>
      <stop offset="100%" stop-color="#071318"/>
    </linearGradient>
    <linearGradient id="hAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B8F87"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B8F87"/>
    </linearGradient>
    <filter id="hGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="240" fill="url(#hBg)" rx="14"/>

  <!-- Subtle ambient glows -->
  <circle cx="760" cy="40"  r="90" fill="#0B8F87" opacity="0.07"/>
  <circle cx="60"  cy="200" r="100" fill="#10B981" opacity="0.06"/>
  <circle cx="410" cy="8"   r="60"  fill="#2563EB" opacity="0.05"/>

  <!-- DNA / helix decorative lines (left) -->
  <g opacity="0.18" stroke="#0B8F87" stroke-width="1.2" fill="none">
    <path d="M 28 30 Q 46 60 28 90 Q 10 120 28 150 Q 46 180 28 210"/>
    <path d="M 48 30 Q 30 60 48 90 Q 66 120 48 150 Q 30 180 48 210"/>
    <line x1="28" y1="60"  x2="48" y2="60"  />
    <line x1="28" y1="90"  x2="48" y2="90"  />
    <line x1="28" y1="120" x2="48" y2="120" />
    <line x1="28" y1="150" x2="48" y2="150" />
    <line x1="28" y1="180" x2="48" y2="180" />
  </g>

  <!-- ECG / waveform decorative line -->
  <polyline
    points="80,210 110,210 125,185 145,235 165,198 185,215 210,215 820,215"
    fill="none" stroke="#10B981" stroke-width="1.8" opacity="0.35"/>

  <!-- Cross / medical icon -->
  <g transform="translate(82,62)" filter="url(#hGlow)">
    <rect x="15" y="0"  width="14" height="46" rx="7" fill="#0B8F87"/>
    <rect x="0"  y="16" width="44" height="14" rx="7" fill="#0B8F87"/>
    <circle cx="22" cy="23" r="30" fill="none" stroke="#10B981" stroke-width="2" opacity="0.55"/>
    <circle cx="22" cy="23" r="38" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Scan lines (right side decoration) -->
  <g opacity="0.12" stroke="#2563EB" stroke-width="1">
    <line x1="700" y1="40"  x2="810" y2="40"/>
    <line x1="690" y1="55"  x2="810" y2="55"/>
    <line x1="700" y1="70"  x2="810" y2="70"/>
    <line x1="710" y1="85"  x2="810" y2="85"/>
    <line x1="700" y1="100" x2="810" y2="100"/>
  </g>
  <rect x="692" y="36" width="4" height="72" rx="2" fill="#2563EB" opacity="0.25"/>

  <!-- Main title -->
  <text x="148" y="108"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="42" font-weight="700"
        fill="url(#hAccent)"
        filter="url(#hGlow)"
        letter-spacing="-0.5">Skin Cancer Detector Bot</text>

  <!-- Tagline -->
  <text x="150" y="145"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="17" fill="#a8d8d4" letter-spacing="1.8">Telegram · AI-Powered Dermatology Assistant</text>

  <!-- Tech stack line -->
  <text x="150" y="175"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="12.5" fill="#6b8a99" font-style="italic">
    HuggingFace ViT  ·  Google Gemini 2.0 Flash  ·  python-telegram-bot v20  ·  PyTorch
  </text>

  <!-- Bottom accent bar -->
  <rect y="232" width="820" height="8" rx="4" fill="url(#hAccent)" opacity="0.85"/>
</svg>
