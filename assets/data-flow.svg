<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="Data Flow Diagram">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="100%" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="dfStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2a36"/>
      <stop offset="100%" stop-color="#082028"/>
    </linearGradient>
    <linearGradient id="dfStepBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f3a"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <marker id="dfArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B8F87"/>
    </marker>
    <marker id="dfArrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="dfArrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="360" fill="url(#dfBg)" rx="14"/>

  <!-- Title -->
  <text x="410" y="30" font-family="'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#a8d8d4" text-anchor="middle" letter-spacing="1">
    REQUEST DATA FLOW
  </text>
  <line x1="120" y1="38" x2="700" y2="38" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>

  <!-- ── TOP ROW: steps 1–5 ── -->

  <!-- Step 1: Photo Received -->
  <rect x="18"  y="58" width="120" height="82" rx="8" fill="url(#dfStepBlue)" stroke="#2563EB" stroke-width="1.3"/>
  <text x="78"  y="82"  font-family="Arial, sans-serif" font-size="19" text-anchor="middle">📷</text>
  <text x="78"  y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">Photo Received</text>
  <text x="78"  y="115" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">Telegram PHOTO filter</text>
  <text x="78"  y="128" font-family="Arial, sans-serif" font-size="9"  fill="#2563EB" text-anchor="middle">update.message.photo</text>

  <!-- Arrow → -->
  <path d="M 138 99 L 160 99" stroke="#0B8F87" stroke-width="1.5" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Step 2: Temp File -->
  <rect x="162" y="58" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="222" y="82"  font-family="Arial, sans-serif" font-size="19" text-anchor="middle">💾</text>
  <text x="222" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">Temp File</text>
  <text x="222" y="115" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">mkstemp(.jpg)</text>
  <text x="222" y="128" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">download_to_drive()</text>

  <!-- Arrow → -->
  <path d="M 282 99 L 304 99" stroke="#0B8F87" stroke-width="1.5" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Step 3: PIL Decode -->
  <rect x="306" y="58" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="366" y="82"  font-family="Arial, sans-serif" font-size="19" text-anchor="middle">🖼️</text>
  <text x="366" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">PIL Decode</text>
  <text x="366" y="115" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">Image.open(path)</text>
  <text x="366" y="128" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">.convert("RGB")</text>

  <!-- Arrow → -->
  <path d="M 426 99 L 448 99" stroke="#0B8F87" stroke-width="1.5" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Step 4: Preprocessor -->
  <rect x="450" y="58" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="510" y="82"  font-family="Arial, sans-serif" font-size="19" text-anchor="middle">⚙️</text>
  <text x="510" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">Preprocessor</text>
  <text x="510" y="115" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">AutoImageProcessor</text>
  <text x="510" y="128" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">resize + normalize</text>

  <!-- Arrow → -->
  <path d="M 570 99 L 592 99" stroke="#0B8F87" stroke-width="1.5" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Step 5: ViT Inference -->
  <rect x="594" y="58" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#10B981" stroke-width="1.3"/>
  <text x="654" y="82"  font-family="Arial, sans-serif" font-size="19" text-anchor="middle">🤗</text>
  <text x="654" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">ViT Inference</text>
  <text x="654" y="115" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">no_grad() forward()</text>
  <text x="654" y="128" font-family="Arial, sans-serif" font-size="9"  fill="#10B981" text-anchor="middle">logits → softmax</text>

  <!-- Step 5 down arrow -->
  <path d="M 654 140 L 654 178" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#dfArrowGreen)"/>
  <text x="664" y="162" font-family="Arial, sans-serif" font-size="8.5" fill="#6b8a99">label + %</text>

  <!-- ── BOTTOM ROW: steps 6–9 (right to left) ── -->

  <!-- Step 6: Classification Output -->
  <rect x="594" y="180" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#10B981" stroke-width="1.3"/>
  <text x="654" y="204" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">🏷️</text>
  <text x="654" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">Classification</text>
  <text x="654" y="237" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">id2label[argmax]</text>
  <text x="654" y="250" font-family="Arial, sans-serif" font-size="9"  fill="#10B981" text-anchor="middle">conf × 100 = %</text>

  <!-- Arrow ← -->
  <path d="M 594 221 L 572 221" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#dfArrowBlue)"/>
  <text x="581" y="215" font-family="Arial, sans-serif" font-size="8.5" fill="#6b8a99">text label</text>

  <!-- Step 7: Gemini API -->
  <rect x="450" y="180" width="120" height="82" rx="8" fill="url(#dfStepBlue)" stroke="#2563EB" stroke-width="1.3"/>
  <text x="510" y="204" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">✨</text>
  <text x="510" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6ec6f5" text-anchor="middle">Gemini API</text>
  <text x="510" y="237" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">gemini-2.0-flash</text>
  <text x="510" y="250" font-family="Arial, sans-serif" font-size="9"  fill="#2563EB" text-anchor="middle">safety + explanation</text>

  <!-- Arrow ← -->
  <path d="M 450 221 L 428 221" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#dfArrowGreen)"/>

  <!-- Step 8: Format Response -->
  <rect x="306" y="180" width="120" height="82" rx="8" fill="url(#dfStep)" stroke="#10B981" stroke-width="1.3"/>
  <text x="366" y="204" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">📝</text>
  <text x="366" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a8d8d4" text-anchor="middle">Format Response</text>
  <text x="366" y="237" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">format_prediction()</text>
  <text x="366" y="250" font-family="Arial, sans-serif" font-size="9"  fill="#10B981" text-anchor="middle">escape_markdown()</text>

  <!-- Arrow ← -->
  <path d="M 306 221 L 284 221" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#dfArrowGreen)"/>

  <!-- Step 9: Reply + Cleanup -->
  <rect x="162" y="180" width="120" height="82" rx="8" fill="url(#dfStepBlue)" stroke="#2563EB" stroke-width="1.3"/>
  <text x="222" y="204" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">📬</text>
  <text x="222" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6ec6f5" text-anchor="middle">Reply + Cleanup</text>
  <text x="222" y="237" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">reply_text(MarkdownV2)</text>
  <text x="222" y="250" font-family="Arial, sans-serif" font-size="9"  fill="#2563EB" text-anchor="middle">os.remove(temp)</text>

  <!-- Connecting step 2 down → step 9 (cleanup tie) -->
  <path d="M 222 140 L 222 180" stroke="#6b8a99" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Error branch indicator -->
  <rect x="18" y="180" width="120" height="82" rx="8" fill="#0a1520" stroke="#6b8a99" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="78" y="208" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">⚠️</text>
  <text x="78" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6b8a99" text-anchor="middle">Error Handler</text>
  <text x="78" y="241" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">except Exception</text>
  <text x="78" y="254" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">friendly error msg</text>
  <path d="M 162 221 L 138 221" stroke="#6b8a99" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#dfArrow)"/>

  <!-- Step number labels -->
  <text x="18"  y="56" font-family="Arial, sans-serif" font-size="9" fill="#2563EB" opacity="0.7">① INPUT</text>
  <text x="162" y="56" font-family="Arial, sans-serif" font-size="9" fill="#0B8F87" opacity="0.7">② WRITE</text>
  <text x="306" y="56" font-family="Arial, sans-serif" font-size="9" fill="#0B8F87" opacity="0.7">③ DECODE</text>
  <text x="450" y="56" font-family="Arial, sans-serif" font-size="9" fill="#0B8F87" opacity="0.7">④ PREPROCESS</text>
  <text x="594" y="56" font-family="Arial, sans-serif" font-size="9" fill="#10B981" opacity="0.7">⑤ INFER</text>
  <text x="594" y="178" font-family="Arial, sans-serif" font-size="9" fill="#10B981" opacity="0.7">⑥ CLASSIFY</text>
  <text x="450" y="178" font-family="Arial, sans-serif" font-size="9" fill="#2563EB" opacity="0.7">⑦ EXPLAIN</text>
  <text x="306" y="178" font-family="Arial, sans-serif" font-size="9" fill="#10B981" opacity="0.7">⑧ FORMAT</text>
  <text x="162" y="178" font-family="Arial, sans-serif" font-size="9" fill="#2563EB" opacity="0.7">⑨ REPLY</text>
  <text x="18"  y="178" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99" opacity="0.7">⚡ ERROR</text>

  <!-- Legend -->
  <rect x="18" y="295" width="784" height="46" rx="6" fill="#071318" stroke="#0B8F87" stroke-width="0.5" opacity="0.8"/>
  <text x="30" y="313" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#a8d8d4">LEGEND</text>
  <line x1="80" y1="308" x2="120" y2="308" stroke="#0B8F87" stroke-width="1.5"/>
  <text x="125" y="312" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99">Teal = local processing</text>
  <line x1="280" y1="308" x2="320" y2="308" stroke="#2563EB" stroke-width="1.5"/>
  <text x="325" y="312" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99">Blue = I/O boundary (Telegram / Gemini)</text>
  <line x1="560" y1="308" x2="600" y2="308" stroke="#10B981" stroke-width="1.5"/>
  <text x="605" y="312" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99">Green = inference output path</text>
  <line x1="80" y1="328" x2="120" y2="328" stroke="#6b8a99" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="125" y="332" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99">Dashed = error / cleanup side-path</text>

  <!-- Bottom accent -->
  <rect y="353" width="820" height="7" rx="3" fill="#10B981" opacity="0.5"/>
</svg>
