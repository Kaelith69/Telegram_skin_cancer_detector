<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="Project Stats Dashboard">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="100%" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="stAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B8F87"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="stBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B8F87"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="230" fill="url(#stBg)" rx="14"/>

  <!-- Title -->
  <text x="410" y="30" font-family="'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#a8d8d4" text-anchor="middle" letter-spacing="1">
    PROJECT AT A GLANCE
  </text>
  <line x1="80" y1="40" x2="740" y2="40" stroke="#0B8F87" stroke-width="0.5" opacity="0.6"/>

  <!-- Card 1: Skin Conditions -->
  <rect x="18"  y="56" width="138" height="112" rx="10" fill="#0d2030" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="87"  y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#10B981" text-anchor="middle">7</text>
  <text x="87"  y="128" font-family="Arial, sans-serif" font-size="11" fill="#a8d8d4" text-anchor="middle">Skin Conditions</text>
  <text x="87"  y="143" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">HAM10000 classes</text>
  <text x="87"  y="157" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">nv · mel · bkl · bcc · akiec · df · vasc</text>

  <!-- Card 2: Model Architecture -->
  <rect x="170" y="56" width="138" height="112" rx="10" fill="#0d2030" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="239" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#10B981" text-anchor="middle">ViT-B/16</text>
  <text x="239" y="128" font-family="Arial, sans-serif" font-size="11" fill="#a8d8d4" text-anchor="middle">Model Architecture</text>
  <text x="239" y="143" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">Vision Transformer</text>
  <text x="239" y="157" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">~86M parameters</text>

  <!-- Card 3: Response Time -->
  <rect x="322" y="56" width="138" height="112" rx="10" fill="#0d2030" stroke="#0B8F87" stroke-width="1.3"/>
  <text x="391" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#10B981" text-anchor="middle">~2 s</text>
  <text x="391" y="128" font-family="Arial, sans-serif" font-size="11" fill="#a8d8d4" text-anchor="middle">Avg. Response Time</text>
  <text x="391" y="143" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">CPU inference + Gemini</text>
  <text x="391" y="157" font-family="Arial, sans-serif" font-size="9"  fill="#0B8F87" text-anchor="middle">15 s Gemini timeout</text>

  <!-- Card 4: Photo Stored -->
  <rect x="474" y="56" width="148" height="112" rx="10" fill="#0d2030" stroke="#10B981" stroke-width="1.3"/>
  <text x="548" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#10B981" text-anchor="middle">0 bytes</text>
  <text x="548" y="128" font-family="Arial, sans-serif" font-size="11" fill="#a8d8d4" text-anchor="middle">Photos Stored</text>
  <text x="548" y="143" font-family="Arial, sans-serif" font-size="9"  fill="#6b8a99" text-anchor="middle">Ephemeral — deleted in finally{}</text>
  <text x="548" y="157" font-family="Arial, sans-serif" font-size="9"  fill="#10B981" text-anchor="middle">No DB · No cloud · No logs</text>

  <!-- Card 5: Lines of Code + Dependencies -->
  <rect x="636" y="56" width="166" height="112" rx="10" fill="#0d2030" stroke="#2563EB" stroke-width="1.3"/>
  <text x="719" y="93"  font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#6ec6f5" text-anchor="middle">~123</text>
  <text x="719" y="111" font-family="Arial, sans-serif" font-size="11" fill="#a8d8d4" text-anchor="middle">Lines of Code</text>
  <line x1="656" y1="120" x2="782" y2="120" stroke="#2563EB" stroke-width="0.5" opacity="0.4"/>
  <text x="719" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#6ec6f5" text-anchor="middle">6</text>
  <text x="719" y="150" font-family="Arial, sans-serif" font-size="10" fill="#a8d8d4" text-anchor="middle">Direct Dependencies</text>
  <text x="719" y="164" font-family="Arial, sans-serif" font-size="9"  fill="#2563EB" text-anchor="middle">bot.py · single-file architecture</text>

  <!-- Stat bar strip -->
  <rect x="18" y="185" width="784" height="26" rx="6" fill="#0d1f2d" stroke="#0B8F87" stroke-width="0.5" opacity="0.5"/>
  <!-- Python badge -->
  <rect x="26"  y="191" width="90" height="14" rx="4" fill="#0B8F87" opacity="0.2"/>
  <text x="71"  y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#a8d8d4" text-anchor="middle">Python 3.10+</text>
  <!-- Platform badge -->
  <rect x="126" y="191" width="90" height="14" rx="4" fill="#0B8F87" opacity="0.2"/>
  <text x="171" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#a8d8d4" text-anchor="middle">Linux / macOS / Win</text>
  <!-- License badge -->
  <rect x="226" y="191" width="60" height="14" rx="4" fill="#0B8F87" opacity="0.2"/>
  <text x="256" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#a8d8d4" text-anchor="middle">MIT License</text>
  <!-- Deploy badge -->
  <rect x="296" y="191" width="100" height="14" rx="4" fill="#2563EB" opacity="0.15"/>
  <text x="346" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#6ec6f5" text-anchor="middle">Heroku / Railway</text>
  <!-- Model badge -->
  <rect x="406" y="191" width="120" height="14" rx="4" fill="#2563EB" opacity="0.15"/>
  <text x="466" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#6ec6f5" text-anchor="middle">Anwarkh1/Skin_Cancer-*</text>
  <!-- Status badge -->
  <rect x="536" y="191" width="80" height="14" rx="4" fill="#10B981" opacity="0.15"/>
  <text x="576" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#10B981" text-anchor="middle">v1.1.0 Stable</text>

  <!-- Bottom accent -->
  <rect y="222" width="820" height="8" rx="4" fill="url(#stAcc)" opacity="0.75"/>
</svg>
