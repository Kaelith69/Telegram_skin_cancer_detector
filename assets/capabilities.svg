<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-label="Capabilities Overview">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="100%" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="capCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2a36"/>
      <stop offset="100%" stop-color="#082028"/>
    </linearGradient>
    <linearGradient id="capBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B8F87"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="capBarBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B8F87"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="480" fill="url(#capBg)" rx="14"/>

  <!-- Title -->
  <text x="410" y="32" font-family="'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#a8d8d4" text-anchor="middle" letter-spacing="1">
    CAPABILITY OVERVIEW
  </text>
  <line x1="80" y1="42" x2="740" y2="42" stroke="#0B8F87" stroke-width="0.5" opacity="0.6"/>

  <!-- Column headers -->
  <text x="60"  y="60" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b8a99">FEATURE</text>
  <text x="420" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b8a99">CONFIDENCE LEVEL</text>
  <text x="680" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b8a99">STATUS</text>

  <!-- ── FEATURE CARDS ── -->

  <!-- Row 1: Image Classification -->
  <rect x="18" y="68" width="784" height="52" rx="7" fill="url(#capCard)" stroke="#0B8F87" stroke-width="1"/>
  <text x="40"  y="92" font-family="Arial, sans-serif" font-size="18">🔬</text>
  <text x="68"  y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a8d8d4">Image Classification</text>
  <text x="68"  y="107" font-family="Arial, sans-serif" font-size="9.5" fill="#6b8a99">ViT-B/16 fine-tuned on HAM10000 — 7 diagnostic classes via softmax</text>
  <rect x="420" y="83" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="83" width="198" height="12" rx="3" fill="url(#capBar)" opacity="0.9"/>
  <text x="648" y="93" font-family="Arial, sans-serif" font-size="9" fill="#10B981">90%</text>
  <rect x="672" y="80" width="120" height="18" rx="9" fill="#0B8F87" opacity="0.15"/>
  <text x="732" y="93" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✅ LIVE</text>

  <!-- Row 2: Confidence Score -->
  <rect x="18" y="128" width="784" height="52" rx="7" fill="url(#capCard)" stroke="#0B8F87" stroke-width="1"/>
  <text x="40"  y="152" font-family="Arial, sans-serif" font-size="18">📊</text>
  <text x="68"  y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a8d8d4">Confidence Score</text>
  <text x="68"  y="167" font-family="Arial, sans-serif" font-size="9.5" fill="#6b8a99">Softmax probabilities expose the model's uncertainty — no false certainty</text>
  <rect x="420" y="143" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="143" width="220" height="12" rx="3" fill="url(#capBar)" opacity="0.9"/>
  <text x="648" y="153" font-family="Arial, sans-serif" font-size="9" fill="#10B981">100%</text>
  <rect x="672" y="140" width="120" height="18" rx="9" fill="#0B8F87" opacity="0.15"/>
  <text x="732" y="153" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✅ LIVE</text>

  <!-- Row 3: Gemini Medical Insights -->
  <rect x="18" y="188" width="784" height="52" rx="7" fill="url(#capCard)" stroke="#2563EB" stroke-width="1"/>
  <text x="40"  y="212" font-family="Arial, sans-serif" font-size="18">🧠</text>
  <text x="68"  y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a8d8d4">AI Medical Insights</text>
  <text x="68"  y="227" font-family="Arial, sans-serif" font-size="9.5" fill="#6b8a99">Gemini 2.0 Flash provides plain-English signs, treatment options, and next steps</text>
  <rect x="420" y="203" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="203" width="187" height="12" rx="3" fill="url(#capBarBlue)" opacity="0.9"/>
  <text x="648" y="213" font-family="Arial, sans-serif" font-size="9" fill="#0B8F87">85%</text>
  <rect x="672" y="200" width="120" height="18" rx="9" fill="#0B8F87" opacity="0.15"/>
  <text x="732" y="213" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✅ LIVE</text>

  <!-- Row 4: Safety Label -->
  <rect x="18" y="248" width="784" height="52" rx="7" fill="url(#capCard)" stroke="#0B8F87" stroke-width="1"/>
  <text x="40"  y="272" font-family="Arial, sans-serif" font-size="18">⚠️</text>
  <text x="68"  y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a8d8d4">Safety Classification</text>
  <text x="68"  y="287" font-family="Arial, sans-serif" font-size="9.5" fill="#6b8a99">One-line verdict: ✅ Benign / ⚠️ Pre-cancerous / ❗ Cancerous — parsed from Gemini response</text>
  <rect x="420" y="263" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="263" width="198" height="12" rx="3" fill="url(#capBar)" opacity="0.9"/>
  <text x="648" y="273" font-family="Arial, sans-serif" font-size="9" fill="#10B981">90%</text>
  <rect x="672" y="260" width="120" height="18" rx="9" fill="#0B8F87" opacity="0.15"/>
  <text x="732" y="273" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✅ LIVE</text>

  <!-- Row 5: Ephemeral Privacy -->
  <rect x="18" y="308" width="784" height="52" rx="7" fill="url(#capCard)" stroke="#10B981" stroke-width="1"/>
  <text x="40"  y="332" font-family="Arial, sans-serif" font-size="18">🔒</text>
  <text x="68"  y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a8d8d4">Ephemeral Processing</text>
  <text x="68"  y="347" font-family="Arial, sans-serif" font-size="9.5" fill="#6b8a99">tempfile.mkstemp() + finally{} delete — images never touch persistent storage or external APIs</text>
  <rect x="420" y="323" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="323" width="220" height="12" rx="3" fill="url(#capBar)" opacity="0.9"/>
  <text x="648" y="333" font-family="Arial, sans-serif" font-size="9" fill="#10B981">100%</text>
  <rect x="672" y="320" width="120" height="18" rx="9" fill="#10B981" opacity="0.12"/>
  <text x="732" y="333" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✅ LIVE</text>

  <!-- Row 6: Multi-language (planned) -->
  <rect x="18" y="368" width="784" height="52" rx="7" fill="#071318" stroke="#6b8a99" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="40"  y="392" font-family="Arial, sans-serif" font-size="18" opacity="0.5">🌍</text>
  <text x="68"  y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#6b8a99">Multi-Language Support</text>
  <text x="68"  y="407" font-family="Arial, sans-serif" font-size="9.5" fill="#445a66">EN/ES/FR/DE response localisation via Gemini prompt parameter</text>
  <rect x="420" y="383" width="220" height="12" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="383" width="66"  height="12" rx="3" fill="#2563EB" opacity="0.4"/>
  <text x="648" y="393" font-family="Arial, sans-serif" font-size="9" fill="#6b8a99">30%</text>
  <rect x="672" y="380" width="120" height="18" rx="9" fill="#2563EB" opacity="0.1"/>
  <text x="732" y="393" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b8a99" text-anchor="middle">🔄 PLANNED</text>

  <!-- Row 7: GPU Inference (idea) -->
  <rect x="18" y="424" width="784" height="38" rx="7" fill="#071318" stroke="#6b8a99" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.7"/>
  <text x="40"  y="447" font-family="Arial, sans-serif" font-size="15" opacity="0.4">⚡</text>
  <text x="65"  y="447" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#445a66">GPU Inference</text>
  <text x="200" y="447" font-family="Arial, sans-serif" font-size="9" fill="#334455">Sub-second classification on CUDA — removes the ~2 s CPU bottleneck</text>
  <rect x="420" y="435" width="220" height="10" rx="3" fill="#0d1f2d"/>
  <rect x="420" y="435" width="22"  height="10" rx="3" fill="#2563EB" opacity="0.3"/>
  <text x="648" y="444" font-family="Arial, sans-serif" font-size="8.5" fill="#445a66">10%</text>
  <text x="732" y="447" font-family="Arial, sans-serif" font-size="9.5" fill="#445a66" text-anchor="middle">💡 IDEA</text>

  <!-- Bottom accent -->
  <rect y="473" width="820" height="7" rx="3" fill="url(#capBar)" opacity="0.7"/>
</svg>
